name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Native build + full CTest suite on real AES-NI hardware. Also uploads
  # the test binary as an artifact so the qemu-aes-on/off jobs below can run
  # the exact same compiled binary under two different emulated CPU models —
  # making brief 2.2's "same binary, correct on two different machines"
  # claim literal rather than just built-twice-and-hoped.
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run harness
        run: ./build/aes_harness
      # AESLIB_FORCE_SOFTWARE (see DESIGN.md's "Functional self-verification
      # of the hardware path") is the one testing override dispatch offers —
      # deliberately software-only. This runner has real AES-NI, so it's the
      # natural place to prove the software path still round-trips correctly
      # when forced on a hardware-capable machine, closing bonus 3.1's "both
      # paths tested where possible" without needing a second QEMU leg.
      - name: Test with AESLIB_FORCE_SOFTWARE
        run: './build/aes_harness | tee /dev/stderr | grep -q "Backend in use: Software"'
        env:
          AESLIB_FORCE_SOFTWARE: "1"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64-binaries
          path: |
            build/tests/aeslib_tests
            build/aes_harness
            build/libaeslib_c.so

  # Runs the SAME binary built above under qemu-x86_64 with an emulated CPU
  # model that advertises AES-NI, and asserts (via AESLIB_EXPECTED_BACKEND,
  # see tests/test_backend.cpp) that active_backend() reports Hardware.
  qemu-aes-on:
    needs: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: linux-x86_64-binaries
      - name: Install qemu-user-static
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - run: chmod +x tests/aeslib_tests aes_harness libaeslib_c.so
      - name: Run tests under qemu -cpu Westmere (AES-NI present)
        env:
          AESLIB_EXPECTED_BACKEND: hardware
        run: qemu-x86_64-static -cpu Westmere tests/aeslib_tests
      - name: Run harness under qemu -cpu Westmere
        run: qemu-x86_64-static -cpu Westmere aes_harness

  # Same binary again, this time under a CPU model with AES-NI masked off —
  # asserts active_backend() reports Software. Together with qemu-aes-on,
  # this is brief 2.2's dispatch requirement made testable in CI. Note this
  # proves detection correctly reports *absence* and that the software path
  # is correct when selected; QEMU's TCG will generally still execute an
  # aesenc instruction even with the feature bit masked, so this does not by
  # itself guarantee a SIGILL if dispatch were broken (see DESIGN.md).
  qemu-aes-off:
    needs: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: linux-x86_64-binaries
      - name: Install qemu-user-static
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - run: chmod +x tests/aeslib_tests aes_harness libaeslib_c.so
      - name: Run tests under qemu -cpu Nehalem (no AES-NI)
        env:
          AESLIB_EXPECTED_BACKEND: software
        run: qemu-x86_64-static -cpu Nehalem tests/aeslib_tests
      - name: Run harness under qemu -cpu Nehalem
        run: qemu-x86_64-static -cpu Nehalem aes_harness

  # Cross-compiles for aarch64 and runs the result under qemu-aarch64 -cpu
  # max, asserting (via AESLIB_EXPECTED_BACKEND, see tests/test_backend.cpp)
  # that active_backend() reports Hardware and that src/aes_core_arm.cpp's
  # real implementation produces correct output under emulation.
  #
  # Unlike the amd64 qemu-aes-on/qemu-aes-off pair above, there is no
  # matching "-off" leg here: QEMU's built-in aarch64 CPU models (cortex-a57,
  # cortex-a72, etc.) all report the AArch64 Crypto Extensions as present —
  # verified empirically (an earlier version of this job used
  # `-cpu cortex-a57` expecting Software and it failed, reporting Hardware
  # instead) and consistent with QEMU's own model definitions, which encode
  # id_aa64isar0 = 0x00011120 (AES+PMULL present) for cortex-a57. This
  # reflects reality: unlike x86-64's AES-NI (optional and genuinely absent
  # on plenty of real deployed CPUs, which is why Nehalem-era QEMU models
  # exist and matter), the AArch64 Crypto Extensions have been close to
  # universal on real silicon since the Cortex-A53/A57 generation, so QEMU
  # doesn't ship a "realistic modern core without it" model to point
  # -cpu at. The software path on arm64 is still proven correct without a
  # dedicated emulated leg: it's the exact same portable expand_key/round-
  # transform code already exercised extensively by the amd64 software-path
  # legs (qemu-aes-off, native x86_64) — arm64 doesn't get a separate
  # implementation — and cpu_detect.cpp's arm64 detection branches are
  # simple, directly-readable capability checks, same as the amd64 case's
  # "closed by code simplicity, not by execution" argument in DESIGN.md.
  qemu-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install aarch64 cross toolchain and qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static
      - name: Configure
        run: cmake -B build-aarch64 -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-aarch64 -j
      - name: Run tests under qemu-aarch64 -cpu max
        env:
          AESLIB_EXPECTED_BACKEND: hardware
        run: qemu-aarch64-static -cpu max -L /usr/aarch64-linux-gnu build-aarch64/tests/aeslib_tests
      - name: Run harness under qemu-aarch64 -cpu max
        run: qemu-aarch64-static -cpu max -L /usr/aarch64-linux-gnu build-aarch64/aes_harness

  # Cross-compiles for riscv64 and runs the result under qemu-riscv64 -cpu
  # max,zkne=true, proving src/aes_core_riscv.cpp's real RV64 Zkne
  # instruction sequence produces correct FIPS-197 output under emulation.
  # Mirrors qemu-aarch64 above, with one deliberate difference explained
  # below: it does NOT assert AESLIB_EXPECTED_BACKEND=hardware.
  #
  # `zkne=true` is a real, accepted QEMU riscv64 CPU property (confirmed
  # directly against a local QEMU 11.1.0 build) that makes QEMU's TCG
  # correctly execute the Zkne instructions — `-cpu max` alone does not
  # enable it. But even with that flag, cpu::has_hw_aes() still reports
  # Software here: checked directly against QEMU's own source
  # (linux-user/syscall.c) at the exact version Ubuntu 24.04 ships
  # (qemu-user-static 8.2.2) and confirmed RISCV_HWPROBE_EXT_ZKNE/ZKND don't
  # exist yet as bit definitions in that version's riscv_hwprobe() syscall
  # implementation — no CPU flag can make an unimplemented bit appear. This
  # is a detection-*reporting* gap specific to this one CI runner's QEMU
  # package version, not a missing-instruction gap (TCG really does execute
  # Zkne correctly here) and not a bug in this project's own
  # riscv_hwprobe()-based detection code.
  #
  # So the backend-dispatch KATs (tests/test_aes_core.cpp's
  # riscv_hardware_matches_fips197_kat_directly and the AES-128 equivalent)
  # call aes_core_riscv.cpp's functions directly, bypassing
  # cpu::has_hw_aes(), specifically so this real gap in one CI runner's QEMU
  # doesn't silently skip proving the RISC-V backend's actual output is
  # correct — the whole rest of the suite still runs the ordinary way, which
  # is why AESLIB_EXPECTED_BACKEND isn't set: on this specific QEMU version
  # Software is the only truthful answer for active_backend() to give.
  qemu-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install riscv64 cross toolchain and qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-riscv64-linux-gnu qemu-user-static
      - name: Configure
        run: cmake -B build-riscv64 -DCMAKE_TOOLCHAIN_FILE=cmake/riscv64-linux-gnu.cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-riscv64 -j
      - name: Run tests under qemu-riscv64 -cpu max,zkne=true
        run: qemu-riscv64-static -cpu max,zkne=true -L /usr/riscv64-linux-gnu build-riscv64/tests/aeslib_tests
      - name: Run harness under qemu-riscv64 -cpu max,zkne=true
        run: qemu-riscv64-static -cpu max,zkne=true -L /usr/riscv64-linux-gnu build-riscv64/aes_harness

  # Real, non-emulated RISC-V hardware via the RISE RISC-V Runners free CI
  # service (physical Scaleway EM-RV1 servers, SOPHGO SG2044 chip) — the
  # riscv64 complement to macos-arm64/linux-arm64-native below. Requires the
  # RISE GitHub App to be installed on this repository first; see
  # https://riseproject.dev/2026/03/24/announcing-the-rise-risc-v-runners-free-native-risc-v-ci-on-github/
  #
  # Deliberately does NOT set AESLIB_EXPECTED_BACKEND=hardware the way
  # linux-arm64-native does: unlike the AArch64 Crypto Extensions (universal
  # on real silicon for years), it is not yet confirmed whether the SG2044
  # chip implements Zkne/Zknd in hardware. This job proves the build and the
  # correctly-selected backend (whichever `active_backend()` reports) work on
  # real riscv64 hardware; whether that backend is Hardware or the Software
  # fallback is left for this job's own output to reveal.
  riscv64-native:
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run harness
        run: ./build/aes_harness

  # Two genuine, non-emulated ARM64 machines — the real-hardware complement
  # to the QEMU legs above (which prove dispatch/correctness under emulation
  # but can't prove real silicon behaves the same way). Both run natively, no
  # cross toolchain or QEMU involved, and both are expected to report
  # Hardware unconditionally since Apple Silicon and GitHub's Arm-hosted
  # Linux runners both implement the AArch64 Crypto Extensions.
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          AESLIB_EXPECTED_BACKEND: hardware
        run: ctest --test-dir build --output-on-failure
      - name: Run harness
        run: ./build/aes_harness

  linux-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          AESLIB_EXPECTED_BACKEND: hardware
        run: ctest --test-dir build --output-on-failure
      - name: Run harness
        run: ./build/aes_harness

  linux-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DAESLIB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
      - name: Run harness
        run: ./build-san/aes_harness

  # First real compilation of the MSVC-specific paths (BCryptGenRandom in
  # src/csprng.cpp, <intrin.h>/__cpuid in src/cpu_detect.cpp) — see brief 2.5.
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run harness
        run: build\Release\aes_harness.exe
